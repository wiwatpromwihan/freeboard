# Classroom simulation. Template sensors are not physical measurements.
esphome:
  name: mushroom-iot-224

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Bangkok
    on_time_sync:
      then:
        - logger.log: "Time synchronized"
        - lambda: |-
            if (id(battery_started_at) == 0) {
              id(battery_started_at) = id(sntp_time).now().timestamp;
            }
            ESP_LOGI("battery", "Battery start epoch: %lu", static_cast<unsigned long>(id(battery_started_at)));

# Store only the start epoch, not a constantly changing percentage.
preferences:
  flash_write_interval: 0s

globals:
  - id: battery_started_at
    type: uint32_t
    restore_value: yes
    initial_value: '0'

# Hold BOOT for 3–10 seconds after boot, then release to start a new demo.
binary_sensor:
  - platform: gpio
    id: battery_reset_key
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_click:
      min_length: 3s
      max_length: 10s
      then:
        - lambda: |-
            if (id(sntp_time).now().is_valid()) {
              id(battery_started_at) = id(sntp_time).now().timestamp;
              ESP_LOGI("battery", "Battery reset: all devices at 100%%");
            } else {
              ESP_LOGW("battery", "Reset skipped: time not ready");
            }

http_request:
  timeout: 10s

sensor:
  - platform: template
    id: air_temperature
    name: "Air Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 24.0 + random_float() * (32.0 - 24.0);

  - platform: template
    id: air_humidity
    name: "Air Humidity"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 75.0 + random_float() * (95.0 - 75.0);

  - platform: template
    id: co2
    name: "CO2"
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return 450.0 + random_float() * (1800.0 - 450.0);

  - platform: template
    id: substrate_moisture
    name: "Substrate Moisture"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 55.0 + random_float() * (75.0 - 55.0);

  - platform: template
    id: illuminance
    name: "Illuminance"
    unit_of_measurement: "lx"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return 100.0 + random_float() * (800.0 - 100.0);

  - platform: template
    id: water_level
    name: "Water Level"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return 20.0 + random_float() * (100.0 - 20.0);

  - platform: template
    id: air_temperature_battery
    name: "Air Temperature Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const auto now = id(sntp_time).now();
      if (!now.is_valid() || id(battery_started_at) == 0) return NAN;
      const double elapsed = std::max(0.0, double(now.timestamp) - double(id(battery_started_at)));
      return std::max(0.0, 100.0 * (1.0 - elapsed / 7200.0));

  - platform: template
    id: air_humidity_battery
    name: "Air Humidity Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const auto now = id(sntp_time).now();
      if (!now.is_valid() || id(battery_started_at) == 0) return NAN;
      const double elapsed = std::max(0.0, double(now.timestamp) - double(id(battery_started_at)));
      return std::max(0.0, 100.0 * (1.0 - elapsed / 8100.0));

  - platform: template
    id: co2_battery
    name: "Co2 Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const auto now = id(sntp_time).now();
      if (!now.is_valid() || id(battery_started_at) == 0) return NAN;
      const double elapsed = std::max(0.0, double(now.timestamp) - double(id(battery_started_at)));
      return std::max(0.0, 100.0 * (1.0 - elapsed / 3600.0));

  - platform: template
    id: substrate_moisture_battery
    name: "Substrate Moisture Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const auto now = id(sntp_time).now();
      if (!now.is_valid() || id(battery_started_at) == 0) return NAN;
      const double elapsed = std::max(0.0, double(now.timestamp) - double(id(battery_started_at)));
      return std::max(0.0, 100.0 * (1.0 - elapsed / 9000.0));

  - platform: template
    id: illuminance_battery
    name: "Illuminance Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const auto now = id(sntp_time).now();
      if (!now.is_valid() || id(battery_started_at) == 0) return NAN;
      const double elapsed = std::max(0.0, double(now.timestamp) - double(id(battery_started_at)));
      return std::max(0.0, 100.0 * (1.0 - elapsed / 10800.0));

  - platform: template
    id: water_level_battery
    name: "Water Level Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const auto now = id(sntp_time).now();
      if (!now.is_valid() || id(battery_started_at) == 0) return NAN;
      const double elapsed = std::max(0.0, double(now.timestamp) - double(id(battery_started_at)));
      return std::max(0.0, 100.0 * (1.0 - elapsed / 5400.0));

interval:
  - interval: 10s
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - lambda: |-
                  return id(sntp_time).now().is_valid();
          then:
            - component.update: air_temperature_battery
            - component.update: air_humidity_battery
            - component.update: co2_battery
            - component.update: substrate_moisture_battery
            - component.update: illuminance_battery
            - component.update: water_level_battery
            - logger.log: "Sending mushroom greenhouse measurements"
            - http_request.send:
                method: PUT
                url: "https://iot-224-default-rtdb.asia-southeast1.firebasedatabase.app/latest.json"
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["air_temperature"] = id(air_temperature).state;
                  root["air_humidity"] = id(air_humidity).state;
                  root["co2"] = id(co2).state;
                  root["substrate_moisture"] = id(substrate_moisture).state;
                  root["illuminance"] = id(illuminance).state;
                  root["water_level"] = id(water_level).state;
                  root["air_temperature_battery"] = id(air_temperature_battery).state;
                  root["air_humidity_battery"] = id(air_humidity_battery).state;
                  root["co2_battery"] = id(co2_battery).state;
                  root["substrate_moisture_battery"] = id(substrate_moisture_battery).state;
                  root["illuminance_battery"] = id(illuminance_battery).state;
                  root["water_level_battery"] = id(water_level_battery).state;
                  root["timestamp"] = id(sntp_time).now().timestamp;
                on_response:
                  then:
                    - logger.log:
                        format: "Latest HTTP status = %d"
                        args:
                          - response->status_code
                on_error:
                  then:
                    - logger.log: "Latest upload failed"
            - http_request.send:
                method: POST
                url: "https://iot-224-default-rtdb.asia-southeast1.firebasedatabase.app/history.json"
                request_headers:
                  Content-Type: application/json
                json: |-
                  root["air_temperature"] = id(air_temperature).state;
                  root["air_humidity"] = id(air_humidity).state;
                  root["co2"] = id(co2).state;
                  root["substrate_moisture"] = id(substrate_moisture).state;
                  root["illuminance"] = id(illuminance).state;
                  root["water_level"] = id(water_level).state;
                  root["air_temperature_battery"] = id(air_temperature_battery).state;
                  root["air_humidity_battery"] = id(air_humidity_battery).state;
                  root["co2_battery"] = id(co2_battery).state;
                  root["substrate_moisture_battery"] = id(substrate_moisture_battery).state;
                  root["illuminance_battery"] = id(illuminance_battery).state;
                  root["water_level_battery"] = id(water_level_battery).state;
                  root["timestamp"] = id(sntp_time).now().timestamp;
                on_response:
                  then:
                    - logger.log:
                        format: "History HTTP status = %d"
                        args:
                          - response->status_code
                on_error:
                  then:
                    - logger.log: "History upload failed"
          else:
            - logger.log: "Skip Firebase: WiFi or time not ready"
